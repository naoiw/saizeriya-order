name: Prune merged branches (one-time)

# Temporary maintenance job. Remove this workflow after confirming its run.
on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, 'fix: prevent mode-switch horizontal shift')
    runs-on: ubuntu-latest
    steps:
      - name: Delete only verified merged feature branches
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DATASET_SHA: 0408a67d7bc718a904f192eb18cf193f610b4c36
        shell: bash
        run: |
          set -euo pipefail
          # Only PRs merged into this repository qualify. Never remove main/develop.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100" \
            --jq '.[] | select(.merged_at != null and .head.repo.full_name == env.GITHUB_REPOSITORY) | .head.ref' \
            > /tmp/merged-heads.txt
          echo "Merged PR branch heads:"
          cat /tmp/merged-heads.txt

          while IFS= read -r branch; do
            if [[ "$branch" == "main" || "$branch" == "develop" || -z "$branch" ]]; then
              continue
            fi
            sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" \
              --jq '.object.sha' 2>/dev/null || true)"
            if [[ -z "$sha" ]]; then
              echo "Already absent: $branch"
              continue
            fi

            if grep -Fxq "$branch" /tmp/merged-heads.txt; then
              echo "Deleting merged PR branch: $branch ($sha)"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            elif [[ "$branch" == "feat/local-dataset-validation" && "$sha" == "$EXPECTED_DATASET_SHA" ]]; then
              # This branch still points to the exact commit already in develop.
              echo "Deleting redundant branch at known merged commit: $branch"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            else
              echo "SKIP unverified branch: $branch ($sha)"
            fi
          done <<'BRANCHES'
          feat/dataset-bootstrap
          feat/local-dataset-validation
          feat/menu-gallery
          feat/official-image-urls
          feat/pages-deploy-workflow
          feat/pages-preview-integration
          feat/pages-production-release
          feat/quiz-mode
          style/align-shared-site-chrome
          fix/stable-mode-width-and-branch-cleanup
          BRANCHES

          echo "Verification of remaining branches:"
          gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name'
