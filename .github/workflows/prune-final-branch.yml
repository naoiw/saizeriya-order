name: Prune final cleanup branch (one-time)

# Remove this workflow from develop after it runs successfully.
on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  prune:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, 'chore: finish temporary branch cleanup')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove completed cleanup PR branch
        shell: bash
        run: |
          set -euo pipefail
          pr="14"
          expected="chore/remove-one-time-branch-cleanup"
          merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.merged')"
          actual="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.ref')"
          if [[ "$merged" != "true" || "$actual" != "$expected" ]]; then
            echo "PR #$pr is not the merged cleanup PR. Aborting."
            exit 1
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$expected"
          echo "Deleted: $expected"
          gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name'
