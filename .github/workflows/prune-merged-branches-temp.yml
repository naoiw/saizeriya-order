name: Prune merged branches (temporary)

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    if: ${{ github.event.head_commit.message == 'chore: prune four merged branches (temporary)' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete four verified merged PR branches
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r branch expected_sha pr; do
            if [[ "$branch" == "main" || "$branch" == "develop" ]]; then
              echo "Refusing to delete protected working branch: $branch"
              exit 1
            fi
            actual_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "Refusing to delete updated branch: $branch ($actual_sha)"
              exit 1
            fi
            pr_merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.merged')"
            pr_branch="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.ref')"
            pr_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.sha')"
            pr_base="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.base.ref')"
            if [[ "$pr_merged" != "true" || "$pr_branch" != "$branch" || "$pr_sha" != "$expected_sha" || "$pr_base" != "develop" ]]; then
              echo "PR #$pr is not verified as merged for $branch; refusing deletion."
              exit 1
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted merged branch $branch (PR #$pr)"
          done <<'BRANCHES'
          feat/five-question-gacha-mobile|bf693424a15d32f3f4dea1e24505a9e25b53f49e|17
          feat/menu-variants-issue-11|e94c733835e049019c212791583d5c77fce2a5bc|15
          fix/gacha-click-to-draw|55055c8c13f3847a1e9dcb23aa03d7e97dd67e6c|19
          fix/gacha-refresh-hash|72f3f204c77e4381ff87f5ff7221decd23c90536|18
          BRANCHES
          echo "Remaining branches:"
          gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name'
