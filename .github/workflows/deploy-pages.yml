name: Deploy GitHub Pages

# Preserve the existing combined production + develop preview site.
# The workflow_run listener becomes active only once this file is on main.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    branches: [develop]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'develop' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: naoiw/.github/.github/workflows/reusable-vite-pages.yml@00047e65d7e53551e2644df02d2f22743ea2c471
    with:
      package-manager: pnpm
      node-version: "26"
      pnpm-version: "9.14.2"
      build-script: build
      publish-preview: true
      preview-branch: develop
      preview-subpath: develop
